apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: my-app-namespace
  labels:
    app: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: web-app-container
        image: mantixxx/my-web-app:v1
        ports:
        - containerPort: 5000
